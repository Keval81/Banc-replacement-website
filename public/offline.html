<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Banc Property Group</title>
  <style>
    :root {
      --primary: #1DBFDD;
      --charcoal: #2C2F33;
      --off-white: #F0F0ED;
      --white: #FFFFFF;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--off-white);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
    }
    
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: var(--white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    
    .icon svg {
      width: 40px;
      height: 40px;
      color: var(--primary);
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    
    p {
      color: #666;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    
    .btn-primary:hover {
      background: #0E8CAB;
    }
    
    .btn-secondary {
      background: white;
      color: var(--charcoal);
      border: 2px solid #e0e0e0;
    }
    
    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .contact {
      margin-top: 32px;
      padding-top: 32px;
      border-top: 1px solid #e0e0e0;
    }
    
    .contact h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #666;
    }
    
    .phone {
      font-size: 24px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background: #0F0F0F;
        color: #F5F5F5;
      }
      
      .icon {
        background: #1A1A1A;
      }
      
      p {
        color: #A0A0A0;
      }
      
      .btn-secondary {
        background: #1A1A1A;
        border-color: #333;
        color: #F5F5F5;
      }
      
      .contact {
        border-color: #333;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
      </svg>
    </div>
    
    <h1>You're offline</h1>
    <p>It looks like you've lost your internet connection. Some features may not be available until you're back online.</p>
    
    <div class="buttons">
      <a href="/" class="btn btn-primary">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Go to Homepage
      </a>
      <button onclick="window.location.reload()" class="btn btn-secondary">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Try Again
      </button>
    </div>
    
    <div class="contact">
      <h2>Or give us a call</h2>
      <a href="tel:01707877781" class="phone">01707 877781</a>
    </div>
  </div>
  
  <script>
    // Check for online status and reload when back online
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
